<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
        <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>


        <!-- the font -->
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&family=VT323&display=swap" rel="stylesheet">

    <style>

            html, body {

                background-color: rgb(54, 44, 94)

            }

            #vcrScreen{

                position: fixed;
                top: 0;
                width: 100vw;
                height: 100vh;
                background-color: rgb(54, 44, 94)

            }

            #scanLines, #bezel {

                position: fixed;
                top: 0;
                width: 100%;
                height: 100%;
                top: 0;
                left: 0;
                pointer-events: none;
                z-index: 2;

            }

            #scanLines {

                opacity: 75%;
                z-index: 1
                
            }

            #content {

                overflow-y: auto;
                height: 100vh;
                color: white;
                text-shadow: 1px 1px 2px black, 0 0 1em blue, 0 0 0.2em blue;
                text-align: center;
                font-family: 'VT323';

            }

            .buttonTransparent {

              background-color: rgba(0,0,0,0.1);
              font-family: 'VT323';
              padding: 10px 20px;
              transition: 0.25s;
              font-weight: bolder;
              cursor: pointer;
              color: white;
              text-shadow: 1px 1px 2px black, 0 0 1em blue, 0 0 0.2em blue;
              border: none;
              border-radius: 15px;
            }

            .buttonTransparent:hover {

              background-color: rgba(0,0,0,0.25);
              animation: shake 0.5s;
              animation-iteration-count: infinite;

            
            }

            .buttonTransparent:active {

              box-shadow: 0px 0px black;
              transform: translate(5px, 5px);

            }

            @keyframes shake {
                0% { transform: translate(0px, 0px) rotate(0deg); }
                10% { transform: translate(0px, -1px) rotate(-0.01deg); }
                20% { transform: translate(-2px, 0px) rotate(0.01deg); }
                30% { transform: translate(2px, 1px) rotate(0deg); }
                40% { transform: translate(0px, 0px) rotate(0.01deg); }
                50% { transform: translate(0px, 1px) rotate(-0.01deg); }
                60% { transform: translate(-2px, 0px) rotate(0deg); }
                70% { transform: translate(2px, 0px) rotate(-0.01deg); }
                80% { transform: translate(0px, 0px) rotate(0.01deg); }
                90% { transform: translate(0px, 1px) rotate(0deg); }
                100% { transform: translate(0px, -1px) rotate(-0.01deg); }
            }

            .roundbord {

                border-radius: 25px;
                border: 2px dashed rgb(255, 255, 255);
                box-shadow: 1px 1px 2px black, 0 0 1em blue, 0 0 0.2em blue;;

            }

    </style>

</head>
<body>
    
    <script type="py" src="main.py"></script>

    <div id="vcrScreen">


        <!-- scanlines -->
        <img src="scanlines.png"id="scanLines">
        <img src="bezel.png"id="bezel">

        <div id="content">

            <h1 style="font-size: 150px; padding-top: 70px;">ICT Club</h1>

            <br><br>

            <div class="container roundbord">

            <br><br>

            <form action="">

                <!-- sku form itself -->

                <h1 style="font-size: 75px;">Candidate Verification System</h1>

                <br><br>

                <div class="row">
                    
                    <div class="col-md-12">

                        <input type="text" id="firstName" style="font-size: 45px;" placeholder="ex. Caleb">

                    </div>
                
                </div>

                <br><br>

                <div class="row">
                    
                    <div class="col-md-12">

                        <input type="text" id="lastName" style="font-size: 45px;" placeholder="ex. Espia">

                    </div>

                </div>

                <br><br>
                
                <div>
                    <!-- cool button which i also used before -->
                    <button type="button" style="font-size: 30px;" class="buttonTransparent" py-click="checkMember">ENTER</button>
                </div>

                <br>

                </div>

                <br><br>

                <h1 id="checkOutput" style="font-size: 50px;"></h1>

                <br><br><br><br><br><br>

            </form>

            <br><br><br><br><br><br>

            </div>

        </div>

    </div>

</body>
